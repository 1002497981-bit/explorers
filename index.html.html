<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק טריוויה - קלפי היסטוריה</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #C9A84C;
            --gold-light: #E8C96A;
            --navy: #0D1B2A;
            --navy-mid: #1B2D42;
            --cream: #F5EDD6;
            --cream-dark: #E8D9B8;
            --red-accent: #8B1A1A;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--navy);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Felt table texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px);
            pointer-events: none;
            z-index: 0;
        }

        /* Vignette */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .font-display { font-family: 'Playfair Display', serif; }

        /* Card 3D */
        .card-scene { perspective: 1200px; }
        .card-inner {
            transition: transform 0.75s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
        }
        .card-back { transform: rotateY(0deg); }
        .card-front { transform: rotateY(180deg); }

        /* Gold border ornament */
        .gold-border {
            border: 3px solid var(--gold);
            box-shadow: 0 0 0 1px rgba(201,168,76,0.3), inset 0 0 0 1px rgba(201,168,76,0.15);
        }

        /* Ornamental corners */
        .corner-ornament {
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: var(--gold);
            opacity: 0.7;
        }
        .corner-tl { top: 12px; right: 12px; border-top: 2px solid; border-right: 2px solid; }
        .corner-tr { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; }
        .corner-bl { bottom: 12px; right: 12px; border-bottom: 2px solid; border-right: 2px solid; }
        .corner-br { bottom: 12px; left: 12px; border-bottom: 2px solid; border-left: 2px solid; }

        /* Answer buttons */
        .answer-btn {
            background: var(--cream);
            border: 2px solid var(--cream-dark);
            color: var(--navy);
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 16px 20px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .answer-btn:hover:not(:disabled) {
            background: var(--gold-light);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 rgba(0,0,0,0.3);
        }
        .answer-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }
        .answer-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(40,167,69,0.4), 0 4px 0 rgba(0,0,0,0.3);
        }
        .answer-btn.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            transform: scale(0.97);
            box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }
        .answer-btn.dimmed {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Feedback overlay */
        .feedback-overlay {
            animation: fadeInScale 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Score badge pulse */
        @keyframes scorePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .score-pulse { animation: scorePulse 0.4s ease; }

        /* Card hover */
        .card-hover:hover { transform: translateY(-6px) rotate(-1deg); }
        .card-hover { transition: transform 0.3s ease; }

        /* Stars animation */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Progress bar */
        .progress-bar {
            height: 6px;
            background: rgba(201,168,76,0.15);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* Deck stack effect */
        .deck-stack::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #1a2a3a;
            border-radius: 16px;
            transform: translate(8px, 8px);
            z-index: -1;
            border: 2px solid rgba(201,168,76,0.2);
        }
        .deck-stack::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #152030;
            border-radius: 16px;
            transform: translate(16px, 16px);
            z-index: -2;
            border: 2px solid rgba(201,168,76,0.1);
        }

        /* Trophy bounce */
        @keyframes trophyBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-12px) rotate(-5deg); }
            75% { transform: translateY(-6px) rotate(5deg); }
        }
        .trophy-anim { animation: trophyBounce 2s ease-in-out infinite; }

        /* Shine effect on card back */
        @keyframes cardShine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .card-shine {
            background: linear-gradient(105deg, transparent 40%, rgba(201,168,76,0.15) 50%, transparent 60%);
            background-size: 200% 100%;
            animation: cardShine 3s ease infinite;
        }

        /* RTL helpers */
        .mr-auto-rtl { margin-left: auto; }
    </style>
</head>
<body>

    <div id="root" class="relative z-10 w-full min-h-screen flex justify-center items-start py-6 px-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /* ── SVG Icons ── */
        const IconLayers = ({size=24, ...p}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>;
        const IconStar = ({size=24, filled=false, ...p}) => <svg width={size} height={size} viewBox="0 0 24 24" fill={filled?"currentColor":"none"} stroke="currentColor" strokeWidth="2" {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const IconCheck = ({size=24,...p}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
        const IconX = ({size=24,...p}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>;
        const IconRefresh = ({size=24,...p}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconTrophy = ({size=24,...p}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
        const IconChevron = ({size=24,...p}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m15 18-6-6 6-6"/></svg>;

        /* ── Decorative diamond divider ── */
        const Divider = () => (
            <div style={{display:'flex',alignItems:'center',gap:8,width:'100%',margin:'8px 0'}}>
                <div style={{flex:1,height:1,background:'linear-gradient(to left, var(--gold), transparent)',opacity:0.4}}/>
                <svg width="12" height="12" viewBox="0 0 12 12"><polygon points="6,0 12,6 6,12 0,6" fill="var(--gold)" opacity="0.7"/></svg>
                <div style={{flex:1,height:1,background:'linear-gradient(to right, var(--gold), transparent)',opacity:0.4}}/>
            </div>
        );

        /* ── Game Data ── */
        const gameData = [
          { name: "Alexander Graham Bell", clue: "I invented the very first telephone in 1876." },
          { name: "Martin Cooper", clue: "I invented the first mobile cell phone in 1973. It was huge and heavy!" },
          { name: "Isaac Newton", clue: "My story is famous for a falling apple and discovering gravity." },
          { name: "Leonardo da Vinci", clue: "I kept a 'magic notebook', painted famous smiles, and even drew a helicopter." },
          { name: "The Wright brothers", clue: "We used our knowledge of bicycles to build the first airplane with wings and an engine." },
          { name: "Christopher Columbus", clue: "My story is about a famous historic voyage sailing across the ocean." },
          { name: "Captain Cook", clue: "I kept a famous logbook of my amazing adventures exploring the seas." },
          { name: "Amelia Earhart", clue: "I am a famous female pilot mentioned in the lesson about early airplanes." },
          { name: "Motorola DynaTAC", clue: "Invented in 1973, I was the first mobile cell phone and weighed 1.1 kilograms." },
          { name: "IBM Simon", clue: "Invented in 1994, I was the first 'smartphone' with a touch screen and software apps." },
          { name: "Telegraph", clue: "Before the telephone was invented, people used me and letters to communicate." },
          { name: "Charles Lindbergh", clue: "I am a famous pilot mentioned in the lesson about the first airplanes, along with Amelia Earhart." },
          { name: "Blanche Scott", clue: "I am a famous female pilot mentioned in the story of the first airplane." },
          { name: "Bicycle", clue: "The Wright brothers used their knowledge of making me to build the first airplane." },
          { name: "Propellers", clue: "The first airplane built by the Wright brothers had wings, an engine, and these spinning parts." },
          { name: "Renaissance", clue: "I am a period of 'rebirth' of ancient ideas when people made scientific discoveries and great art." },
          { name: "Mirror", clue: "Leonardo da Vinci wrote his notebook backwards, so you would need me to read it!" },
          { name: "Helicopter", clue: "I am a flying machine that Leonardo da Vinci drew in his magic notebook long before I was invented." },
          { name: "Mona Lisa", clue: "I am the painting with the famous 'smile' created by the great painter Leonardo da Vinci." },
          { name: "Gravity", clue: "I am the invisible force that pulls things down, famously discovered by Isaac Newton." },
          { name: "An Apple", clue: "I am the fruit that famously fell from a tree in the story of Isaac Newton." },
          { name: "The Ocean", clue: "Christopher Columbus went on a historic voyage sailing across me." },
          { name: "A Logbook", clue: "Captain Cook kept his amazing adventures exploring the seas written inside me." },
          { name: "1876", clue: "I am the year that Alexander Graham Bell invented the very first telephone." },
          { name: "1.1 kilograms", clue: "I am the heavy weight of the first mobile cell phone invented by Martin Cooper." },
          { name: "35 minutes", clue: "I am how long the battery worked on the very first mobile cell phone." },
          { name: "Touch screen", clue: "The IBM Simon was the first smartphone to have software apps and this special type of screen." },
          { name: "Wires", clue: "The first telephones had these long metal strings to carry electricity, but modern mobile phones do not!" }
        ];

        const allNames = [...new Set(gameData.map(d => d.name))];

        function generateOptions(correctName) {
            const others = allNames.filter(n => n !== correctName).sort(() => 0.5 - Math.random()).slice(0, 2);
            return [correctName, ...others].sort(() => 0.5 - Math.random());
        }

        /* ═══════════════════════════════
           START SCREEN
           ═══════════════════════════════ */
        function StartScreen({ onStart }) {
            return (
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'80vh',width:'100%',maxWidth:520,margin:'0 auto'}}>
                    {/* Decorative stars */}
                    <div style={{position:'absolute',top:40,left:'10%',color:'var(--gold)',opacity:0.4,animation:'twinkle 2.3s ease-in-out infinite'}}>✦</div>
                    <div style={{position:'absolute',top:120,right:'8%',color:'var(--gold)',opacity:0.3,animation:'twinkle 3.1s ease-in-out infinite',fontSize:22}}>✦</div>
                    <div style={{position:'absolute',bottom:80,left:'15%',color:'var(--gold)',opacity:0.25,animation:'twinkle 2.7s ease-in-out infinite',fontSize:14}}>✦</div>

                    {/* Main card */}
                    <div style={{
                        background:'linear-gradient(160deg, #1e2d42 0%, #0d1b2a 100%)',
                        borderRadius:20,
                        padding:'48px 40px',
                        textAlign:'center',
                        width:'100%',
                        boxShadow:'0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.25)',
                        position:'relative'
                    }}>
                        {/* Corner ornaments */}
                        <div className="corner-ornament corner-tl"/>
                        <div className="corner-ornament corner-tr"/>
                        <div className="corner-ornament corner-bl"/>
                        <div className="corner-ornament corner-br"/>

                        {/* Logo icon */}
                        <div style={{
                            width:80,height:80,borderRadius:'50%',
                            background:'linear-gradient(135deg, var(--gold), #8B6914)',
                            display:'flex',alignItems:'center',justifyContent:'center',
                            margin:'0 auto 24px',
                            boxShadow:'0 8px 32px rgba(201,168,76,0.35)'
                        }}>
                            <IconLayers size={38} color="#fff"/>
                        </div>

                        <h1 className="font-display" style={{
                            fontSize:42,
                            color:'var(--gold-light)',
                            marginBottom:6,
                            textShadow:'0 2px 20px rgba(201,168,76,0.4)',
                            lineHeight:1.1
                        }}>
                            קלפי היסטוריה
                        </h1>

                        <Divider/>

                        <p style={{color:'var(--cream-dark)',fontSize:'1.05rem',lineHeight:1.7,margin:'16px 0 32px',opacity:0.85}}>
                            שלפו קלף רמז מהחפיסה וגלו מיהי הדמות ההיסטורית, ההמצאה או המושג המפורסם.
                        </p>

                        <div style={{display:'flex',gap:16,justifyContent:'center',marginBottom:28,flexWrap:'wrap'}}>
                            {[{n:'28',label:'קלפים'},{n:'10',label:'נקודות לכרטיס'},{n:'3',label:'אפשרויות'}].map(({n,label})=>(
                                <div key={n} style={{
                                    background:'rgba(201,168,76,0.1)',
                                    border:'1px solid rgba(201,168,76,0.25)',
                                    borderRadius:10,padding:'10px 18px',textAlign:'center'
                                }}>
                                    <div className="font-display" style={{color:'var(--gold)',fontSize:24,fontWeight:700}}>{n}</div>
                                    <div style={{color:'var(--cream-dark)',fontSize:'0.78rem',opacity:0.7}}>{label}</div>
                                </div>
                            ))}
                        </div>

                        <button
                            onClick={onStart}
                            style={{
                                background:'linear-gradient(135deg, var(--gold) 0%, #8B6914 100%)',
                                color:'var(--navy)',
                                border:'none',
                                borderRadius:12,
                                padding:'16px 48px',
                                fontSize:'1.2rem',
                                fontWeight:800,
                                cursor:'pointer',
                                fontFamily:'DM Sans, sans-serif',
                                boxShadow:'0 6px 0 #5a4208, 0 12px 32px rgba(201,168,76,0.3)',
                                transition:'all 0.15s ease',
                                letterSpacing:'0.03em'
                            }}
                            onMouseOver={e=>{e.target.style.transform='translateY(-2px)';e.target.style.boxShadow='0 8px 0 #5a4208, 0 16px 40px rgba(201,168,76,0.35)';}}
                            onMouseOut={e=>{e.target.style.transform='translateY(0)';e.target.style.boxShadow='0 6px 0 #5a4208, 0 12px 32px rgba(201,168,76,0.3)';}}
                        >
                            התחילו לשחק ←
                        </button>
                    </div>
                </div>
            );
        }

        /* ═══════════════════════════════
           PLAYING SCREEN
           ═══════════════════════════════ */
        function PlayingScreen({ questions, currentQIndex, score, cardStatus, selectedName, isCorrect, currentOptions, onDrawCard, onNameClick, onNextCard }) {
            const q = questions[currentQIndex];
            const total = questions.length;
            const progress = (currentQIndex / total) * 100;
            const isFlipped = cardStatus !== 'hidden';

            return (
                <div style={{width:'100%',maxWidth:900,margin:'0 auto'}}>

                    {/* Header bar */}
                    <div style={{
                        display:'flex',alignItems:'center',justifyContent:'space-between',
                        background:'rgba(13,27,42,0.85)',
                        backdropFilter:'blur(12px)',
                        border:'1px solid rgba(201,168,76,0.2)',
                        borderRadius:14,
                        padding:'14px 20px',
                        marginBottom:20,
                        gap:16
                    }}>
                        <div style={{display:'flex',alignItems:'center',gap:8,color:'var(--cream-dark)',fontSize:'0.95rem'}}>
                            <IconLayers size={18} color="var(--gold)" opacity={0.8}/>
                            <span>קלף <span style={{color:'var(--gold)',fontWeight:700}}>{currentQIndex+1}</span> מתוך {total}</span>
                        </div>

                        {/* Progress */}
                        <div style={{flex:1,maxWidth:200}}>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{width:`${progress}%`}}/>
                            </div>
                        </div>

                        {/* Score */}
                        <div style={{
                            display:'flex',alignItems:'center',gap:6,
                            background:'rgba(201,168,76,0.12)',
                            border:'1px solid rgba(201,168,76,0.3)',
                            borderRadius:10,
                            padding:'8px 16px'
                        }}>
                            <IconStar size={18} filled={true} color="var(--gold)"/>
                            <span className="font-display" style={{color:'var(--gold)',fontSize:'1.3rem',fontWeight:700}}>{score}</span>
                            <span style={{color:'var(--cream-dark)',fontSize:'0.8rem',opacity:0.6}}>נק'</span>
                        </div>
                    </div>

                    {/* Play area */}
                    <div style={{display:'flex',gap:24,flexWrap:'wrap',alignItems:'stretch'}}>

                        {/* ── Card Column ── */}
                        <div style={{flex:'1 1 300px',display:'flex',flexDirection:'column',alignItems:'center'}}>
                            <p style={{color:'var(--cream-dark)',opacity:0.7,fontSize:'0.9rem',marginBottom:14,textAlign:'center'}}>
                                {cardStatus === 'hidden' ? '▼ לחצו על הקלף לגילוי הרמז' : '📜 קראו את הרמז בעיון'}
                            </p>

                            {/* 3D Card */}
                            <div
                                className={`card-scene deck-stack ${cardStatus==='hidden'?'card-hover':''}`}
                                style={{width:'100%',maxWidth:280,aspectRatio:'3/4',cursor:cardStatus==='hidden'?'pointer':'default',position:'relative'}}
                                onClick={cardStatus==='hidden'?onDrawCard:undefined}
                            >
                                <div className={`card-inner ${isFlipped?'flipped':''}`}>

                                    {/* BACK */}
                                    <div className="card-face card-back" style={{
                                        background:'linear-gradient(145deg, #1a2d42 0%, #0d1b2a 100%)',
                                        border:'3px solid rgba(201,168,76,0.5)',
                                        display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                                        overflow:'hidden',position:'relative'
                                    }}>
                                        <div className="card-shine" style={{position:'absolute',inset:0,borderRadius:14}}/>
                                        {/* Pattern */}
                                        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:0.06}} viewBox="0 0 200 280" preserveAspectRatio="xMidYMid slice">
                                            {[0,1,2,3,4,5].map(i=>[0,1,2,3,4].map(j=>(
                                                <polygon key={`${i}-${j}`} points={`${i*40+20},${j*50+10} ${i*40+30},${j*50+30} ${i*40+10},${j*50+30}`} fill="none" stroke="#C9A84C" strokeWidth="1"/>
                                            )))}
                                        </svg>
                                        <div style={{
                                            width:80,height:80,borderRadius:'50%',
                                            background:'rgba(201,168,76,0.15)',
                                            border:'2px solid rgba(201,168,76,0.4)',
                                            display:'flex',alignItems:'center',justifyContent:'center',
                                            marginBottom:16,position:'relative',zIndex:1
                                        }}>
                                            <span style={{fontSize:38,filter:'drop-shadow(0 2px 8px rgba(201,168,76,0.5))'}}>?</span>
                                        </div>
                                        <p className="font-display" style={{color:'rgba(201,168,76,0.6)',fontSize:'0.8rem',letterSpacing:'0.2em',position:'relative',zIndex:1}}>
                                            היסטוריה
                                        </p>

                                        {/* Corner ornaments */}
                                        <div style={{position:'absolute',top:10,right:10,color:'rgba(201,168,76,0.5)',fontSize:18}}>✦</div>
                                        <div style={{position:'absolute',bottom:10,left:10,color:'rgba(201,168,76,0.5)',fontSize:18}}>✦</div>
                                    </div>

                                    {/* FRONT (clue) */}
                                    <div className="card-face card-front" style={{
                                        background:'var(--cream)',
                                        border:'3px solid var(--gold)',
                                        display:'flex',flexDirection:'column',
                                        overflow:'hidden',position:'relative'
                                    }}>
                                        {/* Header strip */}
                                        <div style={{
                                            background:'linear-gradient(90deg, var(--navy) 0%, var(--navy-mid) 100%)',
                                            padding:'10px 16px',
                                            textAlign:'center',
                                            borderBottom:'2px solid var(--gold)',
                                            flexShrink:0
                                        }}>
                                            <span className="font-display" style={{color:'var(--gold)',fontSize:'0.8rem',letterSpacing:'0.2em'}}>
                                                ✦ קלף רמז ✦
                                            </span>
                                        </div>

                                        {/* Clue text */}
                                        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px 20px',position:'relative'}}>
                                            <svg style={{position:'absolute',top:10,right:10,opacity:0.08,width:60,height:60}} viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z" fill="var(--navy)"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z" fill="var(--navy)"/></svg>
                                            <p style={{
                                                fontSize:'1.1rem',fontWeight:600,
                                                color:cardStatus==='answered'?'rgba(13,27,42,0.3)':'var(--navy)',
                                                textAlign:'center',lineHeight:1.6,
                                                transition:'color 0.3s ease',
                                                direction:'ltr',fontStyle:'italic',
                                                position:'relative',zIndex:1
                                            }}>
                                                "{q.clue}"
                                            </p>
                                        </div>

                                        {/* Feedback overlay */}
                                        {cardStatus === 'answered' && (
                                            <div className="feedback-overlay" style={{
                                                position:'absolute',inset:0,
                                                background:'rgba(245,237,214,0.97)',
                                                borderRadius:14,
                                                display:'flex',flexDirection:'column',
                                                alignItems:'center',justifyContent:'center',
                                                padding:24,textAlign:'center',
                                                zIndex:10
                                            }}>
                                                {isCorrect ? (
                                                    <>
                                                        <div style={{
                                                            width:72,height:72,borderRadius:'50%',
                                                            background:'rgba(40,167,69,0.15)',
                                                            display:'flex',alignItems:'center',justifyContent:'center',
                                                            marginBottom:12
                                                        }}>
                                                            <IconCheck size={40} color="#28a745"/>
                                                        </div>
                                                        <p className="font-display" style={{color:'#155724',fontSize:'1.5rem',fontWeight:900,marginBottom:4}}>כל הכבוד!</p>
                                                        <p style={{color:'#28a745',fontWeight:700,fontSize:'1.1rem',marginBottom:20}}>+10 נקודות 🌟</p>
                                                    </>
                                                ) : (
                                                    <>
                                                        <div style={{
                                                            width:72,height:72,borderRadius:'50%',
                                                            background:'rgba(220,53,69,0.12)',
                                                            display:'flex',alignItems:'center',justifyContent:'center',
                                                            marginBottom:12
                                                        }}>
                                                            <IconX size={40} color="#dc3545"/>
                                                        </div>
                                                        <p className="font-display" style={{color:'#721c24',fontSize:'1.3rem',fontWeight:900,marginBottom:4}}>לא בדיוק</p>
                                                        <p style={{color:'#721c24',fontWeight:700,fontSize:'0.85rem',marginBottom:4}}>התשובה הנכונה היא:</p>
                                                        <p style={{color:'var(--navy)',fontWeight:800,fontSize:'1rem',marginBottom:20,direction:'ltr'}}>{q.name}</p>
                                                    </>
                                                )}
                                                <button
                                                    onClick={e=>{e.stopPropagation();onNextCard();}}
                                                    style={{
                                                        background:'linear-gradient(135deg, var(--gold) 0%, #8B6914 100%)',
                                                        color:'var(--navy)',border:'none',borderRadius:10,
                                                        padding:'12px 24px',fontWeight:800,fontSize:'0.95rem',
                                                        cursor:'pointer',fontFamily:'DM Sans, sans-serif',
                                                        boxShadow:'0 4px 0 #5a4208',
                                                        transition:'all 0.15s'
                                                    }}
                                                    onMouseOver={e=>{e.target.style.transform='translateY(-2px)';}}
                                                    onMouseOut={e=>{e.target.style.transform='translateY(0)';}}
                                                >
                                                    {currentQIndex < questions.length - 1 ? 'קלף הבא ←' : 'סיום המשחק ★'}
                                                </button>
                                            </div>
                                        )}

                                        {/* Footer */}
                                        <div style={{padding:'8px 16px',borderTop:'1px solid rgba(201,168,76,0.3)',textAlign:'center',flexShrink:0}}>
                                            <span style={{color:'rgba(13,27,42,0.35)',fontSize:'0.7rem',letterSpacing:'0.1em'}}>
                                                {currentQIndex+1} / {total}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* ── Answer Options Column ── */}
                        <div style={{flex:'1 1 260px',display:'flex',flexDirection:'column',justifyContent:'center'}}>
                            <p style={{
                                color:'var(--cream-dark)',
                                opacity: cardStatus === 'hidden' ? 0.35 : 0.8,
                                fontSize:'0.9rem',marginBottom:14,textAlign:'center',
                                transition:'opacity 0.4s ease'
                            }}>
                                {cardStatus === 'hidden' ? '⬅ גלו קודם את הרמז' : 'בחרו את התשובה הנכונה'}
                            </p>

                            <div style={{
                                display:'flex',flexDirection:'column',gap:12,
                                pointerEvents: cardStatus === 'hidden' ? 'none' : 'auto',
                                opacity: cardStatus === 'hidden' ? 0.35 : 1,
                                transition: 'opacity 0.4s ease'
                            }}>
                                {currentOptions.map((name, idx) => {
                                    let cls = '';
                                    if (cardStatus === 'answered') {
                                        if (name === q.name) cls = 'correct';
                                        else if (name === selectedName && !isCorrect) cls = 'wrong';
                                        else cls = 'dimmed';
                                    }
                                    return (
                                        <button
                                            key={name}
                                            className={`answer-btn ${cls}`}
                                            disabled={cardStatus === 'answered'}
                                            onClick={() => onNameClick(name)}
                                        >
                                            <span style={{direction:'ltr',display:'flex',alignItems:'center',gap:8}}>
                                                {cls === 'correct' && <IconCheck size={20} color="#28a745"/>}
                                                {cls === 'wrong' && <IconX size={20} color="#dc3545"/>}
                                                {name}
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ═══════════════════════════════
           END SCREEN
           ═══════════════════════════════ */
        function EndScreen({ score, total, onRestart }) {
            const maxScore = total * 10;
            const pct = score / maxScore;
            const msg = pct === 1
                ? { text: 'ניצחון מושלם! אתם גאוני ההיסטוריה! 🌟', color: '#C9A84C' }
                : pct >= 0.6
                ? { text: 'עבודה מצוינת! היסטוריונים-על! 👑', color: '#28a745' }
                : { text: 'ניסיון טוב! ערבבו ושחקו שוב! 📚', color: '#6c757d' };

            return (
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'80vh',width:'100%',maxWidth:500,margin:'0 auto'}}>
                    <div style={{
                        background:'linear-gradient(160deg, #1e2d42 0%, #0d1b2a 100%)',
                        borderRadius:20,padding:'48px 40px',textAlign:'center',width:'100%',
                        boxShadow:'0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.25)',
                        position:'relative'
                    }}>
                        <div className="corner-ornament corner-tl"/>
                        <div className="corner-ornament corner-tr"/>
                        <div className="corner-ornament corner-bl"/>
                        <div className="corner-ornament corner-br"/>

                        <div className="trophy-anim" style={{fontSize:80,marginBottom:16,display:'block'}}>🏆</div>

                        <h2 className="font-display" style={{color:'var(--gold-light)',fontSize:36,marginBottom:8}}>
                            החפיסה הושלמה!
                        </h2>
                        <Divider/>

                        <div style={{margin:'24px 0'}}>
                            <p style={{color:'var(--cream-dark)',opacity:0.7,marginBottom:8}}>ניקוד סופי</p>
                            <p className="font-display" style={{fontSize:72,color:'var(--gold)',fontWeight:900,lineHeight:1,textShadow:'0 4px 24px rgba(201,168,76,0.4)'}}>{score}</p>
                            <p style={{color:'var(--cream-dark)',opacity:0.5}}>מתוך {maxScore} נקודות</p>
                        </div>

                        {/* Stars */}
                        <div style={{display:'flex',justifyContent:'center',gap:8,marginBottom:20}}>
                            {[1,2,3].map(i => (
                                <IconStar key={i} size={32}
                                    filled={pct >= i/3}
                                    color={pct >= i/3 ? 'var(--gold)' : 'rgba(201,168,76,0.2)'}
                                />
                            ))}
                        </div>

                        <p style={{color:msg.color,fontWeight:700,marginBottom:28}}>{msg.text}</p>

                        <button
                            onClick={onRestart}
                            style={{
                                background:'linear-gradient(135deg, var(--gold) 0%, #8B6914 100%)',
                                color:'var(--navy)',border:'none',borderRadius:12,
                                padding:'16px 48px',fontSize:'1.1rem',fontWeight:800,
                                cursor:'pointer',fontFamily:'DM Sans, sans-serif',
                                boxShadow:'0 6px 0 #5a4208, 0 12px 32px rgba(201,168,76,0.3)',
                                transition:'all 0.15s ease',display:'flex',
                                alignItems:'center',gap:10,margin:'0 auto'
                            }}
                            onMouseOver={e=>{e.currentTarget.style.transform='translateY(-2px)';}}
                            onMouseOut={e=>{e.currentTarget.style.transform='translateY(0)';}}
                        >
                            <IconRefresh size={20}/> ערבבו ושחקו שוב
                        </button>
                    </div>
                </div>
            );
        }

        /* ═══════════════════════════════
           MAIN APP
           ═══════════════════════════════ */
        function App() {
            const [gameState, setGameState] = useState('start');
            const [cardStatus, setCardStatus] = useState('hidden');
            const [questions, setQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedName, setSelectedName] = useState(null);
            const [isCorrect, setIsCorrect] = useState(false);
            const [currentOptions, setCurrentOptions] = useState([]);

            const startGame = () => {
                const shuffled = [...gameData].sort(() => 0.5 - Math.random());
                setQuestions(shuffled);
                setCurrentQIndex(0);
                setScore(0);
                setCardStatus('hidden');
                setSelectedName(null);
                setCurrentOptions(generateOptions(shuffled[0].name));
                setGameState('playing');
            };

            const handleDrawCard = () => { if (cardStatus === 'hidden') setCardStatus('revealed'); };

            const handleNameClick = (name) => {
                if (cardStatus !== 'revealed') return;
                const correct = name === questions[currentQIndex].name;
                setSelectedName(name);
                setIsCorrect(correct);
                setCardStatus('answered');
                if (correct) setScore(p => p + 10);
            };

            const handleNextCard = () => {
                if (currentQIndex < questions.length - 1) {
                    const next = currentQIndex + 1;
                    setCurrentQIndex(next);
                    setCardStatus('hidden');
                    setSelectedName(null);
                    setCurrentOptions(generateOptions(questions[next].name));
                } else {
                    setGameState('end');
                }
            };

            return (
                <div style={{padding:'16px',width:'100%'}}>
                    {gameState === 'start' && <StartScreen onStart={startGame}/>}
                    {gameState === 'playing' && (
                        <PlayingScreen
                            questions={questions}
                            currentQIndex={currentQIndex}
                            score={score}
                            cardStatus={cardStatus}
                            selectedName={selectedName}
                            isCorrect={isCorrect}
                            currentOptions={currentOptions}
                            onDrawCard={handleDrawCard}
                            onNameClick={handleNameClick}
                            onNextCard={handleNextCard}
                        />
                    )}
                    {gameState === 'end' && (
                        <EndScreen score={score} total={questions.length} onRestart={startGame}/>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
