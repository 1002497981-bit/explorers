                        options: ['שביל הזהב', 'דרך המשי', 'נתיב התבלינים'],
                        answer: 'דרך המשי',
                        successMsg: "התשובה נכונה. דרך המשי חיברה את יבשת אירופה כל הדרך עד לסין."
                    },
                    {
                        fact: "סוף סוף הגעת ליעד! אתה פוגש את השליט הגדול קובלאי חאן. אתה עתיד לחיות בחצרו שנים רבות, ולכתוב סיפורים מרתקים שתיקח איתך חזרה הביתה.",
                        challenge: "איזו יבשת עצומה ורחבה הרגע חקרת?",
                        options: ['אפריקה', 'אסיה', 'דרום אמריקה'],
                        answer: 'אסיה',
                        successMsg: "הסיפורים שתכתוב על יבשת אסיה ידהימו את תושבי אירופה ויתנו השראה לדורות של חוקרים בעתיד!"
                    }
                ]
            }
        ];

        function HistorySimulator() {
            const [screen, setScreen] = useState('home'); 
            const [activeFigure, setActiveFigure] = useState(null);
            
            // מצב הכנה (Prep State)
            const [inventory, setInventory] = useState([]);
            const [prepError, setPrepError] = useState("");

            // מצב מסע (Journey State)
            const [journeyStep, setJourneyStep] = useState(0);
            const [showEvent, setShowEvent] = useState(false);
            const [shake, setShake] = useState(false);
            
            // ניקוד (Score State)
            const [mistakes, setMistakes] = useState(0);
            const [completedSims, setCompletedSims] = useState({});

            const startGame = (figureId) => {
                const figure = FIGURES.find(f => f.id === figureId);
                setActiveFigure(figure);
                setInventory([]);
                setPrepError("");
                setJourneyStep(0);
                setMistakes(0);
                setShowEvent(false);
                setScreen('prep');
            };

            const goHome = () => {
                setScreen('home');
                setActiveFigure(null);
            };

            const toggleInventoryItem = (item) => {
                setPrepError("");
                if (inventory.find(i => i.id === item.id)) {
                    setInventory(inventory.filter(i => i.id !== item.id));
                } else {
                    setInventory([...inventory, item]);
                }
            };

            const launchJourney = () => {
                const requiredItems = activeFigure.prepItems.filter(i => i.correct);
                const hasAllRequired = requiredItems.every(req => inventory.some(inv => inv.id === req.id));
                
                const badItem = inventory.find(inv => !inv.correct);

                if (badItem) {
                    setPrepError(badItem.msg || "ארזת משהו שלא שייך לתקופת הזמן הזו!");
                    setShake(true);
                    setTimeout(() => setShake(false), 500);
                    return;
                }

                if (!hasAllRequired) {
                    setPrepError("חסר לך ציוד חיוני! המשך לארוז לפני שנצא.");
                    setShake(true);
                    setTimeout(() => setShake(false), 500);
                    return;
                }

                setScreen('journey');
                setTimeout(() => {
                    setShowEvent(true);
                }, 1500);
            };

            const handleAnswer = (answer) => {
                const currentEvent = activeFigure.journey[journeyStep];
                
                if (answer === currentEvent.answer) {
                    setShowEvent(false);
                    if (journeyStep < activeFigure.journey.length - 1) {
                        setTimeout(() => {
                            setJourneyStep(prev => prev + 1);
                            setTimeout(() => setShowEvent(true), 1500);
                        }, 500);
                    } else {
                        setTimeout(() => {
                            const finalScore = Math.max(3 - mistakes, 1);
                            setCompletedSims({...completedSims, [activeFigure.id]: finalScore});
                            setScreen('result');
                        }, 1000);
                    }
                } else {
                    setMistakes(prev => prev + 1);
                    setShake(true);
                    setTimeout(() => setShake(false), 500);
                }
            };

            // --- רינדור המסך הראשי ---
            const renderHome = () => (
                <div className="max-w-6xl mx-auto p-4 md:p-8 animate-fade-in">
                    <div className="text-center space-y-4 mb-12">
                        <div className="inline-flex items-center justify-center p-4 bg-blue-100 rounded-full mb-4">
                            <MapPin className="w-10 h-10 text-blue-600" />
                        </div>
                        <h1 className="text-4xl md:text-6xl font-extrabold text-slate-800 tracking-tight">
                            סימולטור <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">חוקרי היסטוריה</span>
                        </h1>
                        <p className="text-lg md:text-xl text-slate-600 max-w-2xl mx-auto">
                            אל תקראו רק על היסטוריה—תחוו אותה. ארזו ציוד, התגברו על מכשולים היסטוריים וגלו תגליות.
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {FIGURES.map((figure) => {
                            const IconCmp = figure.icon;
                            const stars = completedSims[figure.id];
                            
                            return (
                                <button
                                    key={figure.id}
                                    onClick={() => startGame(figure.id)}
                                    className="group relative bg-white rounded-3xl p-6 shadow-sm border border-slate-200 hover:shadow-xl hover:-translate-y-2 transition-all duration-300 text-start flex flex-col h-full overflow-hidden"
                                >
                                    <div className={`absolute top-0 end-0 w-full h-3 ${figure.color} transition-all group-hover:h-4`} />
                                    
                                    <div className="flex justify-between items-start mb-6 pt-2">
                                        <div className={`p-4 rounded-2xl ${figure.color} bg-opacity-10 group-hover:scale-110 transition-transform`}>
                                            <IconCmp className={`w-8 h-8 ${figure.color.replace('bg-', 'text-')}`} />
                                        </div>
                                        {stars && (
                                            <div className="flex items-center space-x-1 bg-amber-100 text-amber-600 px-3 py-1.5 rounded-full" dir="ltr">
                                                {[...Array(3)].map((_, i) => (
                                                    <Star key={i} className={`w-4 h-4 ms-1 ${i < stars ? 'fill-current' : 'text-amber-200'}`} />
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    
                                    <h3 className="text-2xl font-bold text-slate-800 mb-2">{figure.name}</h3>
                                    <p className="text-sm font-medium text-slate-500 mb-6">{figure.tagline}</p>
                                    
                                    <div className={`mt-auto inline-flex items-center font-bold ${figure.color.replace('bg-', 'text-')} group-hover:-translate-x-2 transition-transform`}>
                                        <Play className="w-4 h-4 me-2 fill-current rotate-180" /> {stars ? 'שחק שוב במשימה' : 'התחל משימה'} 
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );

            // --- רינדור מסך ההכנה ---
            const renderPrep = () => {
                const ActiveIcon = activeFigure.icon;
                return (
                <div className="max-w-5xl mx-auto p-4 md:p-8 animate-fade-in">
                    <button onClick={goHome} className="flex items-center text-slate-500 hover:text-slate-800 mb-6 font-medium transition-colors">
                        <ArrowBack className="w-5 h-5 me-2" /> בטל משימה
                    </button>

                    <div className="grid md:grid-cols-3 gap-6">
                        <div className={`md:col-span-1 rounded-3xl p-6 text-white ${activeFigure.color} shadow-lg flex flex-col`}>
                            <ActiveIcon className="w-12 h-12 mb-4 opacity-80" />
                            <h2 className="text-3xl font-extrabold mb-2">{activeFigure.name}</h2>
                            <p className="text-lg opacity-90 mb-6 flex-grow">{activeFigure.intro}</p>
                            
                            <div className="bg-black/20 p-4 rounded-xl backdrop-blur-sm">
                                <h4 className="font-bold mb-2 flex items-center"><Backpack className="w-5 h-5 me-2"/> התרמיל שלך</h4>
                                <div className="flex flex-wrap gap-2 min-h-[60px]">
                                    {inventory.length === 0 ? (
                                        <span className="text-white/60 text-sm italic">התרמיל ריק...</span>
                                    ) : (
                                        inventory.map(item => (
                                            <span key={item.id} className="bg-white text-slate-800 px-3 py-1 rounded-full text-sm font-bold shadow-sm animate-bounce-in">
                                                {item.icon} {item.name}
                                            </span>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className={`md:col-span-2 bg-white rounded-3xl p-6 md:p-8 shadow-lg border-2 ${shake ? 'border-red-400 animate-shake' : 'border-slate-100'}`}>
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-2xl font-bold text-slate-800">בחר ציוד</h3>
                                <span className="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-sm font-bold">
                                    לחץ לאריזה/פריקה
                                </span>
                            </div>

                            {prepError && (
                                <div className="mb-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-200 flex items-start animate-fade-in">
                                    <AlertCircle className="w-6 h-6 me-3 flex-shrink-0" />
                                    <p className="font-medium">{prepError}</p>
                                </div>
                            )}

                            <div className="grid grid-cols-2 gap-4 mb-8">
                                {activeFigure.prepItems.map((item) => {
                                    const isPacked = inventory.some(i => i.id === item.id);
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={() => toggleInventoryItem(item)}
                                            className={`relative p-4 md:p-6 rounded-2xl border-2 text-center transition-all duration-200 transform hover:-translate-y-1 ${
                                                isPacked 
                                                    ? `${activeFigure.color} border-transparent text-white shadow-md` 
                                                    : 'border-slate-200 hover:border-slate-300 bg-slate-50 text-slate-700'
                                            }`}
                                        >
                                            {isPacked && <CheckCircle2 className="absolute top-3 end-3 w-5 h-5 text-white" />}
                                            <div className="text-4xl mb-3">{item.icon}</div>
                                            <div className="font-bold">{item.name}</div>
                                        </button>
                                    );
                                })}
                            </div>

                            <button
                                onClick={launchJourney}
                                className={`w-full py-5 rounded-2xl font-extrabold text-xl text-white shadow-lg transition-all ${
                                    inventory.length > 0 
                                        ? `${activeFigure.darkColor} hover:opacity-90 hover:scale-[1.02]` 
                                        : 'bg-slate-300 cursor-not-allowed'
                                }`}
                            >
                                התחל במסע 🚀
                            </button>
                        </div>
                    </div>
                </div>
                );
            };

            // --- רינדור מסך המסע ---
            const renderJourney = () => {
                const totalSteps = activeFigure.journey.length;
                const progressPercent = (journeyStep / totalSteps) * 100;
                const currentEvent = activeFigure.journey[journeyStep];
                const ActiveIcon = activeFigure.icon;

                return (
                    <div className="max-w-5xl mx-auto p-4 md:p-8 animate-fade-in min-h-[80vh] flex flex-col">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center">
                                <ActiveIcon className={`w-8 h-8 me-3 ${activeFigure.color.replace('bg-', 'text-')}`} />
                                המסע
                            </h2>
                            <div className="flex space-x-2 space-x-reverse">
                                {[...Array(totalSteps)].map((_, i) => (
                                    <div key={i} className={`w-3 h-3 rounded-full ${i <= journeyStep ? activeFigure.color : 'bg-slate-200'}`} />
                                ))}
                            </div>
                        </div>

                        {/* שמנו כאן dir="ltr" כדי לשמור על האנימציה של מסלול ההתקדמות פשוטה וחסינה משגיאות עיצוב */}
                        <div dir="ltr" className="relative bg-slate-100 rounded-3xl p-8 flex-grow flex items-center justify-center overflow-hidden border border-slate-200 shadow-inner min-h-[400px]">
                            
                            <div className="absolute inset-0 opacity-10 pointer-events-none flex justify-around items-center">
                                {activeFigure.type === 'explorer' ? (
                                    <><Wind className="w-32 h-32" /><CloudLightning className="w-24 h-24 mt-32" /><Wind className="w-20 h-20 mb-20" /></>
                                ) : (
                                    <><Sparkles className="w-20 h-20" /><PenTool className="w-32 h-32" /><Sparkles className="w-16 h-16 mt-20" /></>
                                )}
                            </div>

                            {/* פס התקדמות אפור */}
                            <div className="absolute md:left-12 md:right-12 md:top-1/2 md:h-2 md:w-auto left-1/2 top-12 bottom-12 w-2 -translate-x-1/2 md:translate-x-0 md:-translate-y-1/2 bg-slate-300 rounded-full"></div>
                            
                            {/* פס התקדמות צבעוני */}
                            <div 
                                className={`absolute md:left-12 md:top-1/2 md:h-2 left-1/2 top-12 w-2 md:w-auto -translate-x-1/2 md:translate-x-0 md:-translate-y-1/2 ${activeFigure.color} rounded-full transition-all duration-1000 ease-in-out`}
                                style={{ 
                                    ...(window.innerWidth >= 768 
                                        ? { width: `calc(${progressPercent}% - 48px)` } 
                                        : { height: `calc(${progressPercent}% - 48px)` })
                                }}
                            ></div>

                            {/* האייקון שזז על המסלול */}
                            <div 
                                className={`absolute flex items-center justify-center w-16 h-16 rounded-full ${activeFigure.darkColor} text-white shadow-xl border-4 border-white z-10 transition-all duration-1000 ease-in-out ${showEvent ? 'animate-pulse' : 'animate-bounce'}`}
                                style={{
                                    ...(window.innerWidth >= 768 
                                        ? { left: `calc(3rem + ${progressPercent}% * 0.85)`, top: '50%', transform: 'translate(-50%, -50%)' }
                                        : { top: `calc(3rem + ${progressPercent}% * 0.85)`, left: '50%', transform: 'translate(-50%, -50%)' })
                                }}
                            >
                                <ActiveIcon className="w-8 h-8" />
                            </div>

                            {/* מודל האירוע שקופץ */}
                            {showEvent && currentEvent && (
                                <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-20 animate-fade-in" dir="rtl">
                                    <div className={`bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl border-b-8 ${activeFigure.darkColor.replace('bg-', 'border-')} ${shake ? 'animate-shake' : ''}`}>
                                        
                                        <div className="flex items-center space-x-3 space-x-reverse mb-4 text-amber-600 font-bold">
                                            <AlertCircle className="w-6 h-6" />
                                            <span>אירוע!</span>
                                        </div>

                                        <p className="text-xl md:text-2xl text-slate-800 font-bold mb-6 leading-relaxed">
                                            {currentEvent.fact}
                                        </p>

                                        <div className="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
                                            <p className="font-semibold text-slate-600 mb-4">{currentEvent.challenge}</p>
                                            <div className="space-y-3">
                                                {currentEvent.options.map((opt, idx) => (
                                                    <button
                                                        key={idx}
                                                        onClick={() => handleAnswer(opt)}
                                                        className={`w-full text-start p-4 rounded-xl border-2 font-bold text-slate-700 transition-all group flex justify-between items-center ${
                                                            shake ? 'border-slate-200' : 'border-slate-200 hover:border-blue-500 hover:bg-blue-50'
                                                        }`}
                                                    >
                                                        {opt}
                                                        <ArrowForward className="w-5 h-5 text-slate-400 group-hover:text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity" />
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {mistakes > 0 && shake && (
                                            <p className="text-center text-red-500 font-bold animate-pulse">תשובה שגויה! נסה אפשרות אחרת.</p>
                                        )}
                                    </div>
                                </div>
                            )}

                            {!showEvent && journeyStep < totalSteps && (
                                <div className="absolute bottom-8 end-8 bg-white/90 backdrop-blur px-6 py-3 rounded-full font-bold text-slate-600 shadow-sm animate-pulse" dir="rtl">
                                    נוסעים...
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // --- רינדור מסך תוצאה ---
            const renderResult = () => {
                const stars = Math.max(3 - mistakes, 1);

                return (
                    <div className="max-w-2xl mx-auto p-4 md:p-8 animate-fade-in mt-10">
                        <div className="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 md:p-12 text-center relative overflow-hidden">
                            
                            <div className={`absolute top-0 end-0 w-full h-4 ${activeFigure.color}`} />
                            
                            <div className="flex justify-center mb-8">
                                <div className={`p-8 rounded-full ${stars === 3 ? 'bg-amber-100 text-amber-500' : 'bg-blue-100 text-blue-500'} relative`}>
                                    <Trophy className="w-24 h-24" />
                                    {stars === 3 && <Sparkles className="absolute -top-2 -end-2 w-10 h-10 text-amber-400 animate-spin-slow" />}
                                </div>
                            </div>
                            
                            <h2 className="text-4xl md:text-5xl font-extrabold text-slate-800 mb-4">
                                המשימה הושלמה בהצלחה!
                            </h2>
                            
                            <p className="text-xl text-slate-600 mb-8">
                                הדרכת את {activeFigure.name} בהצלחה דרך ההיסטוריה.
                            </p>

                            <div className="flex justify-center space-x-2 space-x-reverse mb-10 bg-slate-50 p-6 rounded-2xl inline-flex mx-auto" dir="ltr">
                                {[...Array(3)].map((_, i) => (
                                    <Star 
                                        key={i} 
                                        className={`w-12 h-12 transition-all ms-2 duration-500 delay-${i*100} ${
                                            i < stars ? 'fill-current text-amber-400 scale-110' : 'text-slate-200'
                                        }`} 
                                    />
                                ))}
                            </div>

                            <div className="flex flex-col sm:flex-row justify-center gap-4">
                                <button
                                    onClick={() => startGame(activeFigure.id)}
                                    className="px-8 py-4 rounded-2xl border-2 border-slate-200 font-bold text-slate-600 hover:bg-slate-50 transition-colors"
                                >
                                    שחק שוב
                                </button>
                                <button
                                    onClick={goHome}
                                    className={`px-8 py-4 rounded-2xl font-extrabold text-white shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all ${activeFigure.darkColor}`}
                                >
                                    חזור למסך הראשי
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- מבנה האפליקציה הראשי ---
            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-200 pb-12 overflow-x-hidden">
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
                            <button 
                                className="flex items-center space-x-3 space-x-reverse group"
                                onClick={goHome}
                            >
                                <div className="bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-2 rounded-xl group-hover:scale-105 transition-transform shadow-md">
                                    <MapPin className="w-5 h-5" />
                                </div>
                                <span className="font-extrabold text-xl tracking-tight text-slate-800">סימולטור <span className="text-blue-600">היסטוריה</span></span>
                            </button>
                            
                            {activeFigure && screen !== 'home' && (
                                <div className="hidden sm:flex items-center space-x-2 space-x-reverse text-sm font-bold text-slate-600 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200">
                                    {React.createElement(activeFigure.icon, { className: `w-4 h-4 ${activeFigure.color.replace('bg-', 'text-')}` })}
                                    <span>{activeFigure.name}</span>
                                </div>
                            )}
                        </div>
                    </nav>

                    <main className="w-full">
                        {screen === 'home' && renderHome()}
                        {screen === 'prep' && renderPrep()}
                        {screen === 'journey' && renderJourney()}
                        {screen === 'result' && renderResult()}
                    </main>
                </div>
            );
        }

        // טעינת האפליקציה
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HistorySimulator />);
    </script>
</body>
</html>
